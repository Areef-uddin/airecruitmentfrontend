  <title>TalentAI (Nxsus) • AI-First Recruitment Platform</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      background-color: #080B11;
      margin: 0;
      padding: 0;
      overflow: hidden;
      user-select: none;
    }
    #talentai-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #080B11;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      z-index: 999999;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    #talentai-loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .talentai-spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(217, 70, 239, 0.15);
      border-top-color: #D946EF;
      border-right-color: #8B5CF6;
      border-radius: 50%;
      animation: talentai-spin 0.75s linear infinite;
      margin-bottom: 18px;
    }
    .talentai-brand {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    .talentai-brand span {
      color: #D946EF;
    }
    .talentai-status {
      font-size: 13px;
      color: #94A3B8;
    }
    @keyframes talentai-spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script>
    window.TalentAIWebRTC = (function() {
      let localStream = null;
      let screenStream = null;
      let myUserId = 'me';
      let onSignalCb = null;
      let onRemoteTrackCb = null;

      // Map of remoteUserId -> { userId, pc, remoteStream, candidateQueue: [], audioElem, videoElem }
      const peers = {};

      const rtcConfig = {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'stun:stun2.l.google.com:19302' },
          { urls: 'stun:stun3.l.google.com:19302' },
          { urls: 'stun:stun4.l.google.com:19302' },
          { urls: 'stun:stun.services.mozilla.com' },
          { urls: 'stun:global.stun.twilio.com:3478' },
          {
            urls: [
              'turn:openrelay.metered.ca:80',
              'turn:openrelay.metered.ca:443',
              'turn:openrelay.metered.ca:443?transport=tcp'
            ],
            username: 'openrelay',
            credential: 'openrelay'
          }
        ],
        iceCandidatePoolSize: 10
      };

      let audioCtx = null;
      function ensureAudioContext() {
        try {
          if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          }
          if (audioCtx.state === 'suspended') {
            audioCtx.resume();
          }
        } catch (_) {}
        Object.values(peers).forEach(p => {
          if (p.audioElem) {
            p.audioElem.play().catch(() => {});
          }
        });
      }

      ['click', 'touchstart', 'keydown'].forEach(evt => {
        window.addEventListener(evt, ensureAudioContext, { passive: true });
      });

      function playRemoteAudio(uid, stream) {
        const peer = peers[uid];
        if (!peer) return;

        const audioTracks = stream.getAudioTracks ? stream.getAudioTracks() : [];
        if (audioTracks.length === 0) return;

        // Dedicated audio-only media stream ensures browser HTMLAudio element doesn't get confused by video tracks
        const audioStream = new MediaStream(audioTracks);

        audioTracks.forEach(t => {
          t.onunmute = () => {
            console.log('WebRTC: Remote audio track unmuted for', uid);
            if (peer.audioElem) {
              peer.audioElem.muted = false;
              peer.audioElem.play().catch(() => {});
            }
          };
        });

        // 1. Play through dedicated HTMLAudioElement
        if (peer.audioElem) {
          try {
            peer.audioElem.srcObject = audioStream;
            peer.audioElem.muted = false;
            peer.audioElem.volume = 1.0;
            const playPromise = peer.audioElem.play();
            if (playPromise !== undefined) {
              playPromise.catch(e => {
                console.log('Audio autoplay retry queued for user gesture:', e);
              });
            }
          } catch (err) {
            console.warn('HTMLAudio play error:', err);
          }
        }

        // 2. Route directly to WebAudio Context destination (unmuted, bypasses element autoplay flags)
        try {
          ensureAudioContext();
          if (audioCtx && audioCtx.state === 'running') {
            if (peer.audioSourceNode) {
              try { peer.audioSourceNode.disconnect(); } catch (_) {}
            }
            peer.audioSourceNode = audioCtx.createMediaStreamSource(audioStream);
            peer.audioSourceNode.connect(audioCtx.destination);
          }
        } catch (webaudioErr) {
          console.warn('WebAudio connect error:', webaudioErr);
        }
      }

      // Ensure user interaction unblocks audio playback on all browsers
      const resumeAllWebRTCAudio = () => {
        ensureAudioContext();
        Object.values(peers).forEach(p => {
          if (p.audioElem && p.audioElem.srcObject) {
            p.audioElem.muted = false;
            p.audioElem.volume = 1.0;
            p.audioElem.play().catch(() => {});
          }
          if (p.videoElem && p.videoElem.srcObject) {
            p.videoElem.muted = false;
            p.videoElem.volume = 1.0;
            p.videoElem.play().catch(() => {});
          }
        });
      };
      window.addEventListener('click', resumeAllWebRTCAudio);
      window.addEventListener('touchstart', resumeAllWebRTCAudio);
      window.addEventListener('keydown', resumeAllWebRTCAudio);

      async function getMediaStream() {
        if (localStream) return localStream;
        try {
          localStream = await navigator.mediaDevices.getUserMedia({
            video: { width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { max: 30 } },
            audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
          });
        } catch (e1) {
          try {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
          } catch (e2) {
            try {
              localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            } catch (e3) {
              console.warn('Could not acquire audio/video stream:', e3);
              localStream = null;
            }
          }
        }
        return localStream;
      }

      function syncLocalTracksToPeer(peerObj) {
        if (!localStream || !peerObj || !peerObj.pc) return;
        try {
          const senders = peerObj.pc.getSenders();
          localStream.getTracks().forEach(track => {
            const alreadyAdded = senders.some(s => s.track && s.track.kind === track.kind);
            if (!alreadyAdded) {
              try {
                peerObj.pc.addTrack(track, localStream);
              } catch (addErr) {
                console.warn('Could not add track to peer:', addErr);
              }
            }
          });
        } catch (_) {}
      }

      function getOrCreatePeer(remoteUserId) {
        let uid = String(remoteUserId || 'default');
        if (peers[uid]) {
          syncLocalTracksToPeer(peers[uid]);
          return peers[uid];
        }

        const pc = new RTCPeerConnection(rtcConfig);
        const remoteStream = new MediaStream();

        // Dedicated audio element for this participant so their voice plays loud and clear
        let audioElem = document.getElementById('talentai-audio-' + uid);
        if (!audioElem) {
          audioElem = document.createElement('audio');
          audioElem.id = 'talentai-audio-' + uid;
          audioElem.autoplay = true;
          audioElem.playsInline = true;
          audioElem.muted = false;
          audioElem.volume = 1.0;
          document.body.appendChild(audioElem);
        }

        const peerObj = {
          userId: uid,
          pc: pc,
          remoteStream: remoteStream,
          candidateQueue: [],
          audioElem: audioElem,
          audioSourceNode: null,
          videoElem: null
        };
        peers[uid] = peerObj;

        // Add local tracks to this peer connection
        syncLocalTracksToPeer(peerObj);

        pc.onicecandidate = (event) => {
          if (event.candidate && onSignalCb) {
            onSignalCb(JSON.stringify({
              type: 'candidate',
              candidate: event.candidate,
              from_user: myUserId,
              to_user: uid
            }), uid);
          }
        };

        pc.ontrack = (event) => {
          console.log('WebRTC: Remote track received from', uid, event.track.kind);
          if (!peerObj.remoteStream.getTracks().some(t => t.id === event.track.id)) {
            try {
              peerObj.remoteStream.addTrack(event.track);
            } catch (_) {}
          }

          // Handle Audio
          if (event.track.kind === 'audio' || peerObj.remoteStream.getAudioTracks().length > 0) {
            playRemoteAudio(uid, peerObj.remoteStream);
          }

          // Handle Video: Bind to video element if available
          if (event.track.kind === 'video' || peerObj.remoteStream.getVideoTracks().length > 0) {
            if (peerObj.videoElem) {
              peerObj.videoElem.srcObject = peerObj.remoteStream;
              peerObj.videoElem.play().catch(() => {});
            }
          }

          if (onRemoteTrackCb) {
            onRemoteTrackCb(uid, true);
          }
        };

        pc.onconnectionstatechange = () => {
          console.log('WebRTC peer connection state for', uid, ':', pc.connectionState);
          if (pc.connectionState === 'connected') {
            if (peerObj.remoteStream && peerObj.remoteStream.getAudioTracks().length > 0) {
              playRemoteAudio(uid, peerObj.remoteStream);
            }
            if (peerObj.videoElem && peerObj.remoteStream && peerObj.remoteStream.getVideoTracks().length > 0) {
              peerObj.videoElem.srcObject = peerObj.remoteStream;
              peerObj.videoElem.play().catch(() => {});
            }
          } else if (pc.connectionState === 'failed') {
            try {
              pc.restartIce();
            } catch (_) {}
          }
        };

        return peerObj;
      }

      return {
        init: async function(onSignal, onRemoteTrack, userId) {
          onSignalCb = onSignal;
          onRemoteTrackCb = onRemoteTrack;
          if (userId) myUserId = String(userId);
          const stream = await getMediaStream();
          Object.values(peers).forEach(p => syncLocalTracksToPeer(p));
          return Boolean(stream);
        },

        setUserId: function(userId) {
          if (userId) myUserId = String(userId);
        },

        attachLocalVideo: function(videoElem) {
          if (videoElem) {
            videoElem.id = 'talentai-local-video';
            videoElem.setAttribute('playsinline', 'true');
            videoElem.setAttribute('webkit-playsinline', 'true');
            if (localStream) {
              videoElem.srcObject = localStream;
              videoElem.play().catch(() => {});
            }
          }
        },

        attachRemoteVideoForUser: function(remoteUserId, videoElem) {
          let uid = String(remoteUserId || '');
          if (videoElem) {
            videoElem.setAttribute('playsinline', 'true');
            videoElem.setAttribute('webkit-playsinline', 'true');
            videoElem.muted = true;
            videoElem.autoplay = true;

            // Match exact uid, or if only 1 remote peer exists, match that peer
            let peer = peers[uid];
            if (!peer) {
              const allKeys = Object.keys(peers);
              const foundKey = allKeys.find(k => peers[k].remoteStream && peers[k].remoteStream.getVideoTracks().length > 0) || allKeys[0];
              if (foundKey) {
                uid = foundKey;
                peer = peers[uid];
              } else {
                peer = getOrCreatePeer(uid);
              }
            }
            if (peer) {
              peer.videoElem = videoElem;
              if (peer.remoteStream) {
                videoElem.srcObject = peer.remoteStream;
                videoElem.muted = false;
                videoElem.volume = 1.0;
                videoElem.play().catch(() => {});
              }
            }
          }
        },

        attachRemoteVideo: function(videoElem) {
          const firstKey = Object.keys(peers)[0] || 'default';
          window.TalentAIWebRTC.attachRemoteVideoForUser(firstKey, videoElem);
        },

        createOfferForUser: async function(remoteUserId, iceRestart) {
          try {
            const uid = String(remoteUserId);
            if (!localStream) {
              localStream = await getMediaStream();
            }
            const peer = getOrCreatePeer(uid);
            syncLocalTracksToPeer(peer);
            if (peer.pc.signalingState !== 'stable' && !iceRestart) {
              return;
            }
            const offer = await peer.pc.createOffer({
              offerToReceiveAudio: true,
              offerToReceiveVideo: true,
              iceRestart: Boolean(iceRestart)
            });
            await peer.pc.setLocalDescription(offer);
            if (onSignalCb) {
              onSignalCb(JSON.stringify({
                type: 'offer',
                sdp: peer.pc.localDescription,
                from_user: myUserId,
                to_user: uid
              }), uid);
            }
          } catch (e) {
            console.error('Failed to create WebRTC offer for', remoteUserId, e);
          }
        },

        createOffer: async function() {
          const keys = Object.keys(peers);
          if (keys.length > 0) {
            for (const k of keys) {
              await window.TalentAIWebRTC.createOfferForUser(k, false);
            }
          }
        },

        handleSignal: async function(signalJson, explicitFromUser) {
          try {
            const signal = typeof signalJson === 'string' ? JSON.parse(signalJson) : signalJson;
            const fromUser = String(signal.from_user || explicitFromUser || 'default');
            const toUser = signal.to_user ? String(signal.to_user) : '';

            // Ignore if signal is specifically addressed to someone else
            if (toUser && toUser !== 'all' && toUser !== '' && toUser !== String(myUserId)) {
              return;
            }

            // Don't process signals from myself
            if (fromUser === String(myUserId)) {
              return;
            }

            if (!localStream) {
              localStream = await getMediaStream();
            }

            const peer = getOrCreatePeer(fromUser);
            syncLocalTracksToPeer(peer);

            if (signal.type === 'offer') {
              await peer.pc.setRemoteDescription(new RTCSessionDescription(signal.sdp));

              // Process any queued ICE candidates
              if (peer.candidateQueue.length > 0) {
                for (const cand of peer.candidateQueue) {
                  try {
                    await peer.pc.addIceCandidate(new RTCIceCandidate(cand));
                  } catch (_) {}
                }
                peer.candidateQueue = [];
              }

              const answer = await peer.pc.createAnswer();
              await peer.pc.setLocalDescription(answer);
              if (onSignalCb) {
                onSignalCb(JSON.stringify({
                  type: 'answer',
                  sdp: peer.pc.localDescription,
                  from_user: myUserId,
                  to_user: fromUser
                }), fromUser);
              }
            } else if (signal.type === 'answer') {
              if (peer.pc.signalingState !== 'stable') {
                await peer.pc.setRemoteDescription(new RTCSessionDescription(signal.sdp));

                // Process any queued ICE candidates
                if (peer.candidateQueue.length > 0) {
                  for (const cand of peer.candidateQueue) {
                    try {
                      await peer.pc.addIceCandidate(new RTCIceCandidate(cand));
                    } catch (_) {}
                  }
                  peer.candidateQueue = [];
                }
              }
            } else if (signal.type === 'candidate' && signal.candidate) {
              if (peer.pc.remoteDescription && peer.pc.remoteDescription.type) {
                try {
                  await peer.pc.addIceCandidate(new RTCIceCandidate(signal.candidate));
                } catch (iceErr) {
                  console.warn('Error adding ICE candidate:', iceErr);
                }
              } else {
                peer.candidateQueue.push(signal.candidate);
              }
            }
          } catch (e) {
            console.error('Failed to handle WebRTC signal:', e);
          }
        },

        toggleCamera: async function(enabled) {
          if (!localStream && enabled) {
            localStream = await getMediaStream();
          }

          if (localStream) {
            let videoTracks = localStream.getVideoTracks();
            if (enabled && videoTracks.length === 0) {
              try {
                const newCamStream = await navigator.mediaDevices.getUserMedia({ video: true });
                const newTrack = newCamStream.getVideoTracks()[0];
                if (newTrack) {
                  localStream.addTrack(newTrack);
                  videoTracks = [newTrack];
                  Object.values(peers).forEach(p => {
                    if (p.pc) {
                      p.pc.addTrack(newTrack, localStream);
                    }
                  });
                }
              } catch (camErr) {
                console.warn('Could not acquire camera on toggle:', camErr);
              }
            }

            videoTracks.forEach(t => t.enabled = enabled);
          }

          const localVideo = document.getElementById('talentai-local-video');
          if (localVideo && localStream) {
            localVideo.srcObject = localStream;
            localVideo.play().catch(() => {});
          }
        },

        toggleMic: async function(enabled) {
          if (!localStream && enabled) {
            localStream = await getMediaStream();
          }
          if (localStream) {
            let audioTracks = localStream.getAudioTracks();
            if (enabled && audioTracks.length === 0) {
              try {
                const newAudio = await navigator.mediaDevices.getUserMedia({
                  audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
                });
                const newTrack = newAudio.getAudioTracks()[0];
                if (newTrack) {
                  localStream.addTrack(newTrack);
                  audioTracks = [newTrack];
                  Object.values(peers).forEach(p => {
                    if (p.pc) {
                      const senders = p.pc.getSenders();
                      const existing = senders.find(s => s.track && s.track.kind === 'audio');
                      if (existing) {
                        existing.replaceTrack(newTrack);
                      } else {
                        p.pc.addTrack(newTrack, localStream);
                      }
                    }
                  });
                }
              } catch (micErr) {
                console.warn('Could not acquire mic track on unmute:', micErr);
              }
            }
            audioTracks.forEach(t => {
              t.enabled = Boolean(enabled);
            });
            console.log('WebRTC: Local mic toggled ->', Boolean(enabled), 'tracks:', audioTracks.length);
          }
        },

        startScreenShare: async function(onAttached) {
          try {
            screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
            const screenTrack = screenStream.getVideoTracks()[0];
            Object.values(peers).forEach(p => {
              if (p.pc) {
                const sender = p.pc.getSenders().find(s => s.track && s.track.kind === 'video');
                if (sender) {
                  sender.replaceTrack(screenTrack);
                } else {
                  p.pc.addTrack(screenTrack, screenStream);
                }
              }
            });
            screenTrack.onended = () => {
              window.TalentAIWebRTC.stopScreenShare();
            };
            if (onAttached) onAttached(screenStream);
            return true;
          } catch (e) {
            console.warn('Screen share cancelled/failed:', e);
            return false;
          }
        },

        stopScreenShare: function() {
          if (screenStream) {
            screenStream.getTracks().forEach(t => t.stop());
            screenStream = null;
          }
          if (localStream) {
            const videoTrack = localStream.getVideoTracks()[0];
            if (videoTrack) {
              Object.values(peers).forEach(p => {
                if (p.pc) {
                  const sender = p.pc.getSenders().find(s => s.track && s.track.kind === 'video');
                  if (sender) {
                    sender.replaceTrack(videoTrack);
                  }
                }
              });
            }
          }
        },

        getLocalStream: function() {
          return localStream;
        },

        getRemoteStreamForUser: function(remoteUserId) {
          const p = peers[String(remoteUserId)];
          return p ? p.remoteStream : null;
        },

        close: function() {
          if (localStream) {
            localStream.getTracks().forEach(t => t.stop());
            localStream = null;
          }
          if (screenStream) {
            screenStream.getTracks().forEach(t => t.stop());
            screenStream = null;
          }
          Object.values(peers).forEach(p => {
            if (p.pc) {
              try { p.pc.close(); } catch (_) {}
            }
            if (p.audioElem) {
              try { p.audioElem.remove(); } catch (_) {}
            }
          });
          for (const k in peers) delete peers[k];
        }
      };
    })();

    window.TalentAISpeech = (function() {
      let recognition = null;
      let active = false;
      let onTranscriptCb = null;

      const langMap = {
        'Hindi': 'hi-IN',
        'English': 'en-US',
        'Spanish': 'es-ES',
        'French': 'fr-FR',
        'German': 'de-DE',
        'Japanese': 'ja-JP',
        'Arabic': 'ar-SA',
        'Auto / Original': 'en-US'
      };

      return {
        start: function(languageName, onTranscript) {
          onTranscriptCb = onTranscript;
          active = true;

          const SpeechClass = window.SpeechRecognition || window.webkitSpeechRecognition;
          if (!SpeechClass) {
            console.warn('Web Speech API not supported in this browser.');
            return false;
          }

          if (recognition) {
            try { recognition.stop(); } catch (_) {}
          }

          try {
            recognition = new SpeechClass();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = langMap[languageName] || 'en-US';

            recognition.onresult = function(event) {
              let interim = '';
              let finalTranscript = '';
              for (let i = event.resultIndex; i < event.results.length; ++i) {
                const res = event.results[i];
                if (res.isFinal) {
                  finalTranscript += res[0].transcript;
                } else {
                  interim += res[0].transcript;
                }
              }
              const spoken = (finalTranscript || interim).trim();
              if (spoken && onTranscriptCb) {
                onTranscriptCb(spoken, Boolean(finalTranscript));
              }
            };

            recognition.onerror = function(err) {
              console.warn('Speech recognition error:', err.error);
            };

            recognition.onend = function() {
              if (active) {
                setTimeout(() => {
                  if (active) {
                    try { recognition.start(); } catch (_) {}
                  }
                }, 300);
              }
            };

            recognition.start();
            return true;
          } catch (e) {
            console.error('Failed to start speech recognition:', e);
            return false;
          }
        },

        stop: function() {
          active = false;
          if (recognition) {
            try { recognition.stop(); } catch (_) {}
            recognition = null;
          }
        },

        speak: function(text, onStart, onEnd) {
          if (!('speechSynthesis' in window)) {
            if (onEnd) onEnd();
            return false;
          }
          try {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            utterance.lang = 'en-US';

            const voices = window.speechSynthesis.getVoices();
            const preferred = voices.find(v => (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Samantha') || v.name.includes('Zira') || v.name.includes('Victoria')) && v.lang.startsWith('en')) || voices.find(v => v.lang.startsWith('en'));
            if (preferred) utterance.voice = preferred;

            let completed = false;
            let resumeTimer = null;
            let safetyTimer = null;

            const handleFinish = function() {
              if (completed) return;
              completed = true;
              if (resumeTimer) clearInterval(resumeTimer);
              if (safetyTimer) clearTimeout(safetyTimer);
              if (onEnd) onEnd();
            };

            utterance.onstart = function() {
              if (onStart) onStart();
              // Chrome fix: SpeechSynthesis pause/resume keepalive
              resumeTimer = setInterval(function() {
                if (!window.speechSynthesis.speaking) {
                  clearInterval(resumeTimer);
                } else {
                  window.speechSynthesis.pause();
                  window.speechSynthesis.resume();
                }
              }, 4000);
            };

            utterance.onend = handleFinish;
            utterance.onerror = handleFinish;

            // Fallback safety timeout based on word count
            const words = (text || '').trim().split(/\s+/).length;
            const maxDurationMs = Math.max(7000, Math.ceil((words / 2.2) * 1000) + 3000);
            safetyTimer = setTimeout(handleFinish, maxDurationMs);

            window.speechSynthesis.speak(utterance);
            return true;
          } catch (e) {
            console.warn('Speech synthesis error:', e);
            if (onEnd) onEnd();
            return false;
          }
        },

        stopSpeaking: function() {
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
          }
        },

        isSpeaking: function() {
          return Boolean('speechSynthesis' in window && window.speechSynthesis.speaking);
        }
      };
    })();
  </script>

          loader.classList.add('hidden');
          setTimeout(function() {
            if (loader.parentNode) loader.parentNode.removeChild(loader);
          }, 400);

      window.addEventListener('flutter-first-frame', dismissLoader);

      var observer = new MutationObserver(function() {
        var view = document.querySelector('flutter-view') || document.querySelector('flt-glass-pane');
        if (view) {
          dismissLoader();
          observer.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });

      var checkInterval = setInterval(function() {
        var view = document.querySelector('flutter-view') || document.querySelector('flt-glass-pane');
        if (view) {
          clearInterval(checkInterval);
          dismissLoader();
        }

      setTimeout(function() {

        dismissLoader();
      }, 5000);
